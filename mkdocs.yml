site_name: "Super Individuals CIC"
site_url: "https://community.sicic.org"
site_description: "A public-interest community for helping domain experts build domain-specific AI agents"

theme:
  name: material
  custom_dir: overrides
  logo: assets/si-logo.png
  favicon: assets/si-logo.png
  font:
    text: DM Sans
    code: IBM Plex Mono
  palette:
    primary: black
    accent: amber
  features:
    - navigation.top
    - navigation.sections
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - macros

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_templates:
  - robots.txt

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/analytics-events.js

not_in_nav: |
  partners.md
  cohort/index.md
  cohort/intro-batch-1.md
  cohort/goldfield-zeroclaw.md
  cohort/patricio-zeroclaw.md
  cohort/shu-hackstudio-pro.md
  cohort/tuo-paper-party.md
  cohort/venkatesan-zeroclaw.md
  cohort/palma-zeroclaw.md
  cohort/chikeka-bricolage.md
  cohort/loio-zeroclaw.md
  cohort/luzuka-chip.md
  cohort/linton-zeroclaw.md
  cohort/ripa-fanepath.md
  cohort/kumar-newsaware.md
  cohort/shardlow-agents.md
  cohort/erlingsson-agent-character.md
  cohort/simsek-task-agent.md
  cohort/pope-finance-lab.md
  cohort/tozija-profile.md
  privacy-policy.md
  refund-policy.md
  terms-of-service.md
  booking-terms.md

nav:
  - Home: index.md
  - About: about.md
  - Community: community.md
  - Course: course.md
  - For Teams: teams.md
  - Contact: contact.md

extra:
  # --- Single source of truth for facts shown across pages (do not hardcode these elsewhere) ---
  founding_total: 31            # total founding-cohort places
  cpd_membership_no: "22924"    # The CPD Certification Service membership number
  cpd_courses_accredited: false # GUARD: flip to true ONLY once The CPD Certification Service
                                # confirms accreditation for the course (booking terms section 10)

  # --- The course ---
  course_name: "Introduction to AI Agent Building in the Wild"
  # Booking form. Every CTA on the site reads this one value. If it is ever emptied,
  # CTAs fall back to a mailto: registration link at register_email rather than break.
  course_form_url: "https://forms.fillout.com/t/eGbEPUMLR5us"
  cohort_start: "late September 2026"  # first cohort; publish exact dates once fixed
  cohort_places: 15                    # cap per cohort (booking terms section 2)
  cohort_minimum: 12                   # minimum to run (booking terms section 8)
  course_hours: 30                     # structured, directed learning hours = CPD hours
  course_weeks: 2
  course_days: 8                       # guided learning days
  course_price_founding: "GBP 499"     # Founding Circle
  course_price_earlybird: "GBP 599"    # Early Bird & Alumni Network
  course_price_standard: "GBP 649"     # Standard, open to all
  course_api_credit: "US$30"           # third-party spend credited back on completion
  # 15-minute fit call for hesitant readers. Deliberately NOT in the hero — it sits
  # after pricing and after the FAQ, where hesitation actually occurs.
  intro_call_url: "https://calendly.com/yiju-jia/intro-call-ai-agent-building-in-the-wild"

  # --- Company / contact ---
  company_number: "17248930"
  registered_office: "11 Third Avenue, Stoke, Plymouth, United Kingdom"
  register_email: "register@sicic.org"     # bookings, cancellations, complaints
  general_email: "publication@sicic.org"   # everything else
  policy_updated: "August 2026"

  scoping_cta: "mailto:publication@sicic.org?subject=Scoping%20call%20request%20%E2%80%94%20For%20Teams"
  analytics:
    provider: google
    property: G-TXWEDLJP1D
  consent:
    title: Cookie consent
    description: >-
      We use cookies to measure how visitors use this site, through Google
      Analytics, so we can improve it. You can accept or reject these analytics
      cookies, and change your choice at any time.
    cookies:
      analytics:
        name: Google Analytics
        checked: false
    actions:
      - accept
      - reject
      - manage
  social:
    # - icon: fontawesome/brands/github
    #   link: https://github.com/sicic-org
    - icon: material/linkedin
      link: https://www.linkedin.com/company/super-individual-cic
    - icon: material/email
      link: mailto:publication@sicic.org
